# ---------- Project identity (SonarQube Cloud: https://sonarcloud.io) ----------
# Must match the organization and project keys shown in SonarQube Cloud
# (Project -> Information). These are the defaults when importing the GitHub repo.
sonar.organization=padhiyarshail15-cpu
sonar.projectKey=padhiyarshail15-cpu_Tech-Service
sonar.projectName=Tech-Service
sonar.sourceEncoding=UTF-8

# ---------- What to analyse ----------
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=src/**/*.test.ts,src/**/*.test.tsx
# Only generated code, static assets and test infrastructure are excluded.
# Never exclude business logic just to make the Quality Gate pass.
sonar.exclusions=src/**/*.test.ts,src/**/*.test.tsx,src/test/**,src/assets/**
sonar.coverage.exclusions=src/main.tsx,src/**/*.d.ts

# ---------- TypeScript ----------
sonar.typescript.tsconfigPaths=tsconfig.app.json

# ---------- Reports produced earlier in the pipeline ----------
# yarn test:coverage -> coverage/lcov.info
sonar.javascript.lcov.reportPaths=coverage/lcov.info
# yarn lint:report -> reports/eslint-report.json (ESLint issues imported into Sonar)
sonar.eslint.reportPaths=reports/eslint-report.json

# Server URL (https://sonarcloud.io) and token are NOT stored here;
# Jenkins injects them via withSonarQubeEnv('sonarcloud').
# Branch and PR names are detected automatically in a Jenkins Multibranch Pipeline.
